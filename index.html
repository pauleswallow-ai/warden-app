<!DOCTYPE html>
<html>
<head>
    <title>WARDEN NAVIGATOR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --brand-yellow: #FFD700; --brand-black: #000000; }
        body { margin: 0; padding: 0; font-family: 'Arial Black', sans-serif; background: var(--brand-black); color: var(--brand-yellow); }
        #map { height: 70vh; width: 100%; border-bottom: 4px solid var(--brand-yellow); }
        
        /* The Waze-style Login Overlay */
        #auth-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--brand-black); z-index: 9999; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        
        .controls { padding: 15px; display: grid; gap: 10px; }
        input, select, button { 
            background: var(--brand-black); color: var(--brand-yellow); 
            border: 2px solid var(--brand-yellow); padding: 15px; font-size: 16px; font-weight: bold;
        }
        button { background: var(--brand-yellow); color: var(--brand-black); text-transform: uppercase; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <h1>WARDEN ID</h1>
    <input type="text" id="warden-name-input" placeholder="ENTER YOUR NAME">
    <button onclick="setWardenID()">INITIALIZE APP</button>
</div>

<div id="map"></div>

<div class="controls">
    <div style="font-size: 12px;">ID: <span id="active-warden">---</span></div>
    <input type="text" id="route-id" placeholder="ROUTE ID (ST15-xxx)">
    <input type="text" id="nickname" placeholder="NICKNAME (e.g. Broken Stile)">
    <select id="is-fork">
        <option value="NO">NOT A FORK</option>
        <option value="YES">IS A FORK</option>
    </select>
    <button onclick="saveWardenPoint()">SAVE WAYPOINT</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const WEB_APP_URL = "YOUR_DEPLOYED_URL_HERE";
    const map = L.map('map').setView([52.9064, -2.1485], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // Sprint 1 Logic: Check for saved Identity
    window.onload = function() {
        const savedName = localStorage.getItem('wardenName');
        if (savedName) {
            document.getElementById('auth-overlay').classList.add('hidden');
            document.getElementById('active-warden').innerText = savedName;
        }
    };

    function setWardenID() {
        const name = document.getElementById('warden-name-input').value;
        if (name) {
            localStorage.setItem('wardenName', name);
            location.reload();
        }
    }

    function saveWardenPoint() {
        const btn = document.querySelector('button[onclick="saveWardenPoint()"]');
        btn.innerText = "UPLOADING...";
        
        navigator.geolocation.getCurrentPosition(pos => {
            const payload = {
                wardenName: localStorage.getItem('wardenName'),
                routeId: document.getElementById('route-id').value,
                nickname: document.getElementById('nickname').value,
                isFork: document.getElementById('is-fork').value,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude
            };

            fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .then(() => {
                alert("Waypoint Logged!");
                btn.innerText = "SAVE WAYPOINT";
                document.getElementById('nickname').value = "";
            });
        });
    }
</script>
</body>
</html>
